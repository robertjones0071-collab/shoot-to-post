[package]
name = "shoot-to-post-scorer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local HyperIQA scoring proof; preserves original images and archive ratings"

[dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
lto = "thin"
